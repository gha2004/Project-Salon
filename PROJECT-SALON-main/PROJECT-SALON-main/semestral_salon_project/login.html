<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - DJ Salon</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        min-height: 100vh;
        padding: 2rem 1rem;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(28, 17, 22, 0.65), rgba(28, 17, 22, 0.82)),
          url("image/login/salon.jpg") center / cover fixed;
      }

      .auth-card {
        width: min(100%, 440px);
        padding: 2rem;
        border: 1px solid rgba(232, 130, 153, 0.25);
        border-radius: var(--radius-lg);
        background: rgba(28, 17, 22, 0.95);
        color: #fff;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <main class="auth-card">
      <a class="navbar-brand fw-bold text-decoration-none" href="index%20.html">
        <i class="fa-solid fa-scissors me-2 text-pink"></i>DJ
        <span>Salon</span>
      </a>
      <h1 class="font-heading fs-3 text-pink mt-4 mb-1">Welcome back</h1>
      <p class="small text-white-50 mb-4">Sign in to your salon account.</p>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="loginUsername" class="form-label small text-white-50 fw-semibold">
            Username / Name
          </label>
          <input
            type="text"
            class="form-control bg-dark text-white border-secondary"
            id="loginUsername"
            autocomplete="username"
            placeholder="Enter username or name"
            required
          />
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label small text-white-50 fw-semibold">
            Password
          </label>
          <input
            type="password"
            class="form-control bg-dark text-white border-secondary"
            id="loginPassword"
            autocomplete="current-password"
            placeholder="Enter password"
            required
          />
        </div>
        <div id="loginAlert" class="alert alert-danger p-2 small d-none" role="alert"></div>
        <button type="submit" class="btn btn-pink w-100 rounded-pill py-2 fw-bold">
          Sign In
        </button>
      </form>
      <p class="small text-center text-white-50 mt-4 mb-0">
        New to DJ Salon?
        <a class="text-pink fw-semibold" href="register.html">Create an account</a>
      </p>
      <a class="d-block small text-center text-white-50 mt-3" href="index%20.html">
        Return to salon
      </a>
    </main>

    <script src="auth.js"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          const username = document
            .getElementById("loginUsername")
            .value.trim()
            .toLowerCase();
          const password = document.getElementById("loginPassword").value;
          const alert = document.getElementById("loginAlert");

          try {
            const user = window.DJSALON_AUTH.getUsers().find(
              (account) =>
                account.username.toLowerCase() === username &&
                account.password === password,
            );
            if (!user) {
              alert.textContent = "Invalid username or password.";
              alert.classList.remove("d-none");
              return;
            }
            window.DJSALON_AUTH.setCurrentUser(user);
            window.location.assign("index%20.html");
          } catch (error) {
            alert.textContent =
              error && error.message
                ? error.message
                : "Could not read salon accounts from this browser.";
            alert.classList.remove("d-none");
          }
        });
    </script>
  </body>
</html>
